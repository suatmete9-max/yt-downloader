<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast YouTube MP4 Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .box { 
            width: 100%;
            max-width: 550px; 
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            margin: 20px 0;
            transition: transform 0.3s ease;
        }
        .box:hover {
            transform: translateY(-5px);
        }
        h2 {
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #718096;
            font-size: 15px;
            margin-bottom: 25px;
        }
        input { 
            width: 90%; 
            padding: 15px; 
            margin-bottom: 20px; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 15px; 
            outline: none;
            transition: border-color 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }
        input:focus {
            border-color: #ff0000;
        }
        .btn-main { 
            background: linear-gradient(90deg, #ff0000, #cc0000); 
            color: white; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: 600; 
            letter-spacing: 0.5px;
            width: 90%;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }
        .btn-main:hover { 
            background: linear-gradient(90deg, #cc0000, #990000);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }
        #status { 
            margin-top: 25px; 
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 8px;
        }
        .ad-container {
            width: 100%;
            max-width: 550px;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- 1. Header Adsterra Banner Ad -->
    <div class="ad-container" style="margin-bottom: 10px;">
        <!-- Banner Script Yahan Aayega -->
    </div>

    <div class="box">
        <h2>YouTube 1-Click Downloader</h2>
        <p>Paste your YouTube Video Link below to start downloading.</p>
        
        <input type="text" id="userInput" placeholder="https://youtube.com/watch?v=...">
        <button class="btn-main" onclick="fetchVideo()">Download High Quality MP4</button>

        <div id="status"></div>
    </div>

    <!-- 2. Footer Adsterra Banner Ad -->
    <div class="ad-container" style="margin-top: 10px;">
        <!-- Banner Script Yahan Aayega -->
    </div>

    <script>
        function fetchVideo() {
            const inputLink = document.getElementById('userInput').value;
            const statusDiv = document.getElementById('status');
            
            if (!inputLink.includes("youtube.com") && !inputLink.includes("youtu.be")) {
                statusDiv.innerHTML = "<div style='background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px;'>Please enter a valid YouTube link!</div>";
                return;
            }

            statusDiv.innerHTML = "<div style='background: #fef3c7; color: #d97706; padding: 12px; border-radius: 8px;'>Processing video... Please wait ⏳</div>";

            const backendUrl = '/download?url=' + encodeURIComponent(inputLink);
            window.location.href = backendUrl;
            
            setTimeout(() => {
                statusDiv.innerHTML = "<div style='background: #d1fae5; color: #059669; padding: 12px; border-radius: 8px;'>✅ Download Started! Check your device storage.</div>";
            }, 3000);
        }
    </script>

    <!-- 3. Adsterra Pop-Under Script -->
    <script src="https://pl31144559.profitableratecpmnetwork.com/46/8a/07/468a07f692f307cd7fb88aec5a4294f6.js"></script>
</body>
</html>
